<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AVENGERS: DOOMSDAY</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23000000' stroke='%2300ff88' stroke-width='4'/%3E%3Ctext x='50' y='72' font-family='sans-serif' font-size='68' font-weight='900' fill='%2300ff88' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23000000' stroke='%2300ff88' stroke-width='4'/%3E%3Ctext x='50' y='72' font-family='sans-serif' font-size='68' font-weight='900' fill='%2300ff88' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#05070a">

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #05070a;
      --card-bg: rgba(14, 18, 28, 0.94);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-doom: #00ff88;
      --accent-mcu: #ff3344;
      --accent-watched: #a855f7;
      --accent-xmen: #f5b301;
      --accent-spidey: #00d2ff;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(0, 255, 136, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(255, 51, 68, 0.06) 0%, transparent 40%);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 15px 12px 145px 12px;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
      position: relative;
    }

    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 12px;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .doom-icon-svg {
      width: 38px;
      height: 38px;
      border-radius: 50%;
    }

    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ffffff, #00ff88, #00d2ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .countdown-box {
      width: 100%;
      display: flex;
      justify-content: space-around;
      background: rgba(11, 15, 24, 0.95);
      border: 1px solid rgba(0, 255, 136, 0.3);
      padding: 8px 6px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
    }

    .timer-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .timer-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--accent-doom);
      line-height: 1.1;
    }

    .timer-label {
      font-size: 0.52rem;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 1px;
      margin-top: 2px;
    }

    .progress-bar-container {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      height: 6px;
      margin-top: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-doom), var(--accent-watched));
      width: 0%;
      transition: width 0.3s ease;
    }

    .progress-text {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 4px;
      text-align: right;
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      margin-bottom: 8px;
      position: relative;
    }

    .search-box {
      flex-grow: 1;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box input {
      width: 100%;
      background: rgba(14, 18, 28, 0.9);
      border: 1px solid var(--card-border);
      padding: 10px 12px 10px 36px;
      border-radius: 12px;
      color: #fff;
      font-size: 0.82rem;
      outline: none;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .sparkle-btn, .dots-btn {
      width: 40px;
      height: 40px;
      background: rgba(14, 18, 28, 0.95);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: #fff;
      display: grid;
      place-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .sparkle-btn {
      background: rgba(0, 255, 136, 0.12);
      border-color: rgba(0, 255, 136, 0.3);
      color: var(--accent-doom);
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: 50px;
      right: 0;
      width: 235px;
      background: #0d121d;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 8px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.9);
      z-index: 999999;
    }

    .dropdown-menu.show {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .menu-item {
      background: transparent;
      border: none;
      color: var(--text-main);
      padding: 10px 12px;
      text-align: left;
      font-size: 0.78rem;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .menu-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .menu-item.green { color: var(--accent-doom); }
    .menu-item.cyan { color: var(--accent-spidey); }
    .menu-item.github-link { color: #f3f4f6; }
    .menu-item.red { color: #ff4d4d; }

    .menu-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 4px 0;
    }

    .tab-content {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      margin-top: 6px;
    }

    .tab-content.active {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 315px);
    }

    .bar-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .bar-header h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .count-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.1);
    }

    #tab-mcu .bar-header { border-top: 4px solid var(--accent-mcu); }
    #tab-mcu h2 { color: var(--accent-mcu); }

    #tab-watched .bar-header { border-top: 4px solid var(--accent-watched); }
    #tab-watched h2 { color: var(--accent-watched); }

    #tab-xmen .bar-header { border-top: 4px solid var(--accent-xmen); }
    #tab-xmen h2 { color: var(--accent-xmen); }

    #tab-spidey .bar-header { border-top: 4px solid var(--accent-spidey); }
    #tab-spidey h2 { color: var(--accent-spidey); }

    .list-wrapper {
      padding: 10px;
      overflow-y: auto;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .list-wrapper::-webkit-scrollbar { width: 4px; }
    .list-wrapper::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 2px;
    }

    .item-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 12px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .item-checkbox {
      appearance: none;
      width: 22px;
      height: 22px;
      border: 2px solid var(--text-muted);
      border-radius: 6px;
      outline: none;
      cursor: pointer;
      display: grid;
      place-content: center;
      flex-shrink: 0;
    }

    .item-checkbox:checked {
      background: var(--accent-watched);
      border-color: var(--accent-watched);
    }

    .item-checkbox:checked::before {
      content: '✓';
      color: #fff;
      font-size: 14px;
      font-weight: 900;
    }

    .item-index-badge {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 3px 7px;
      border-radius: 6px;
      min-width: 36px;
      text-align: center;
      flex-shrink: 0;
    }

    .item-info {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .item-title {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.25;
      color: #ffffff;
    }

    .item-meta {
      font-size: 0.7rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .meta-tag {
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      font-size: 0.62rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .empty-placeholder {
      display: flex;
      height: 100%;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.82rem;
      padding: 20px;
    }

    .bottom-guard {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #000000;
      padding-top: 10px;
      padding-bottom: max(20px, env(safe-area-inset-bottom, 20px));
      z-index: 99999;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.95);
      display: flex;
      justify-content: center;
    }

    .bottom-nav {
      width: calc(100% - 16px);
      max-width: 600px;
      background: rgba(16, 21, 32, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 16px;
      display: flex;
      justify-content: space-between;
      padding: 6px 4px;
    }

    .nav-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 2px;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 0.60rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      text-align: center;
    }

    .nav-btn .badge-pill {
      font-size: 0.62rem;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 10px;
    }

    .nav-btn.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
    }

    .nav-btn[data-tab="mcu"].active { color: var(--accent-mcu); }
    .nav-btn[data-tab="watched"].active { color: var(--accent-watched); }
    .nav-btn[data-tab="xmen"].active { color: var(--accent-xmen); }
    .nav-btn[data-tab="spidey"].active { color: var(--accent-spidey); }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <div class="brand-box">
        <svg class="doom-icon-svg" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="48" fill="#000000" stroke="#00ff88" stroke-width="4"/>
          <text x="50" y="72" font-family="sans-serif" font-size="68" font-weight="900" fill="#00ff88" text-anchor="middle">A</text>
        </svg>
        <h1 class="title">AVENGERS: DOOMSDAY</h1>
      </div>
      
      <div class="countdown-box">
        <div class="timer-unit">
          <span class="timer-value" id="months">00</span>
          <span class="timer-label">Months</span>

          <span class="timer-label">Secs</span>
        </div>
      </div>

      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <div class="progress-text" id="progress-stats">0 of 87 (0%)</div>
    </header>

    <div class="controls-row">
      <div class="search-box">

        <input type="text" id="search-input" placeholder="Search movies, series..." oninput="handleSearch(this.value)">
      </div>

      <button class="sparkle-btn" title="Quick Insights" onclick="openMagicInsight()">✨</button>

      <div class="dropdown-menu" id="dropdown-menu">
        <button class="menu-item green" onclick="toggleMenu()">

        </button>
        <button class="menu-item" onclick="markAllCurrentTab(false)">
          <span>◻️</span> Mark All in Tab as Unwatched
        </button>
        <div class="menu-divider"></div>

          <span>Star Dooms on GitHub</span>

        <div class="menu-divider"></div>
        <button class="menu-item red" onclick="resetAllData()">
          <span>🗑️</span> Reset All Watch History
        </button>
      </div>
    </div>

    <!-- 1. MCU MOVIES & SHOWS -->
    <section class="tab-content active" id="tab-mcu">
      <div class="bar-header">
        <h2>MCU MOVIES & SHOWS (68)</h2>
        <span class="count-badge" id="mcu-count">0 Left</span>
      </div>
      <div class="list-wrapper" id="bar1-list"></div>
    </section>

    <!-- 2. WATCHED -->
    <section class="tab-content" id="tab-watched">
      <div class="bar-header">
        <h2>WATCHED</h2>
        <span class="count-badge" id="watched-count">0 Done</span>
      </div>
      <div class="list-wrapper" id="bar2-list">
        <div class="empty-placeholder">No items marked as watched yet.<br>Click any movie/series to shift it here!</div>
      </div>
    </section>

    <!-- 3. X-MEN MOVIES -->
    <section class="tab-content" id="tab-xmen">
      <div class="bar-header">
        <h2>X-MEN MOVIES (14)</h2>
        <span class="count-badge" id="xmen-count">0 Left</span>
      </div>
      <div class="list-wrapper" id="bar3-list"></div>
    </section>

    <!-- 4. NON MCU MOVIES -->
    <section class="tab-content" id="tab-spidey">
      <div class="bar-header">
        <h2>NON MCU MOVIES (5)</h2>
        <span class="count-badge" id="spidey-count">0 Left</span>
      </div>
      <div class="list-wrapper" id="bar4-list"></div>
    </section>
  </div>

  <!-- BOTTOM NAVIGATION BAR -->
  <div class="bottom-guard">
    <nav class="bottom-nav">
      <button class="nav-btn active" data-tab="mcu" onclick="switchTab('mcu')">
        <span>MCU MOVIES & SHOWS</span>
        <span class="badge-pill" id="badge-mcu">0</span>
      </button>
      <button class="nav-btn" data-tab="watched" onclick="switchTab('watched')">
        <span>WATCHED</span>
        <span class="badge-pill" id="badge-watched">0</span>
      </button>
      <button class="nav-btn" data-tab="xmen" onclick="switchTab('xmen')">
        <span>X-MEN MOVIES</span>
        <span class="badge-pill" id="badge-xmen">0</span>
      </button>
      <button class="nav-btn" data-tab="spidey" onclick="switchTab('spidey')">
        <span>NON MCU MOVIES</span>
        <span class="badge-pill" id="badge-spidey">0</span>
      </button>
    </nav>
  </div>

    function safeGet(key) {
      try { return localStorage.getItem(key); } catch (e) { return null; }
    }
    function safeSet(key, val) {
      try { localStorage.setItem(key, val); } catch (e) {}
    }

    function initData() {
      items = [];
      rawMCU.forEach((title, index) => {
        items.push({ id: `mcu_${index}`, title, category: 'mcu', originalIndex: index + 1, watched: false });
      });
      rawXMen.forEach((title, index) => {
        items.push({ id: `xmen_${index}`, title, category: 'xmen', originalIndex: index + 1, watched: false });
      });
      rawSpidey.forEach((title, index) => {
        items.push({ id: `spidey_${index}`, title, category: 'spidey', originalIndex: index + 1, watched: false });
      });

      const saved = safeGet('dooms_app_v87_v0006') || safeGet('dooms_app_v87_star_dooms') || safeGet('dooms_app_v87_star_github') || safeGet('dooms_app_v87_named_final') || safeGet('dooms_app_v87_named_v3') || safeGet('dooms_app_v87_named_v2') || safeGet('dooms_app_v87_final');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed)) {
            parsed.forEach(savedItem => {
              const match = items.find(i => i.id === savedItem.id);
              if (match) match.watched = Boolean(savedItem.watched);
            });
          }
        } catch (err) {}
      }
    }

    function toggleMenu() {
      const menu = document.getElementById('dropdown-menu');
      menu.classList.toggle('show');
    }

    document.addEventListener('click', (e) => {
      const menu = document.getElementById('dropdown-menu');
      const dotsBtn = document.querySelector('.dots-btn');
      if (menu && !menu.contains(e.target) && !dotsBtn.contains(e.target)) {
        menu.classList.remove('show');
      }
    });

    function forceSyncRefresh() {
      toggleMenu();
      if ('caches' in window) {
        caches.keys().then(names => names.forEach(name => caches.delete(name)));
      }
      location.reload();
    }

    function openMagicInsight() {
      const unwatched = items.filter(i => !i.watched);
      if (unwatched.length > 0) {
        alert(`✨ Next Up in Timeline:\n\n${unwatched[0].title}`);
      } else {
        alert("🎉 Congratulations! You have completed all 87 movies and shows!");
      }
    }

    function markAllCurrentTab(status) {
      toggleMenu();
      items.forEach(i => {
        if (currentActiveTab === 'watched') {
          i.watched = status;
        } else if (i.category === currentActiveTab) {
          i.watched = status;
        }
      });
      safeSet('dooms_app_v87_v0006', JSON.stringify(items));
      render();
    }

    function resetAllData() {
      toggleMenu();
      if (confirm("Are you sure you want to reset all watch history?")) {
        items.forEach(i => i.watched = false);
        safeSet('dooms_app_v87_v0006', JSON.stringify(items));
        render();
      }
    }

    function handleSearch(val) {
      searchQuery = val.toLowerCase().trim();
      render();
    }

    function toggleWatch(id) {
      const item = items.find(i => i.id === id);
      if (item) {
        item.watched = !item.watched;
        safeSet('dooms_app_v87_v0006', JSON.stringify(items));
        render();
      }
    }

    function switchTab(tabId) {
      currentActiveTab = tabId;
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));

      const selectedTab = document.getElementById(`tab-${tabId}`);
      const selectedBtn = document.querySelector(`.nav-btn[data-tab="${tabId}"]`);
      if (selectedTab) selectedTab.classList.add('active');
      if (selectedBtn) selectedBtn.classList.add('active');
    }

    function updateCountdown() {
      try {
        const now = new Date();
        const target = new Date(2026, 11, 18, 0, 0, 1, 0);
        
        if (target > now) {
          let years = target.getFullYear() - now.getFullYear();
          let months = target.getMonth() - now.getMonth() + (years * 12);
          let days = target.getDate() - now.getDate();
          let hours = target.getHours() - now.getHours();
          let minutes = target.getMinutes() - now.getMinutes();
          let seconds = target.getSeconds() - now.getSeconds();

          if (seconds < 0) { seconds += 60; minutes--; }
          if (minutes < 0) { minutes += 60; hours--; }
          if (hours < 0) { hours += 24; days--; }
          if (days < 0) {
            const prevMonthLastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
            days += prevMonthLastDay;
            months--;
          }

          document.getElementById("months").innerText = String(months).padStart(2, '0');
          document.getElementById("days").innerText = String(days).padStart(2, '0');
          document.getElementById("hours").innerText = String(hours).padStart(2, '0');
          document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
          document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
        } else {
          document.getElementById("months").innerText = "00";
          document.getElementById("days").innerText = "00";
          document.getElementById("hours").innerText = "00";
          document.getElementById("minutes").innerText = "00";
          document.getElementById("seconds").innerText = "00";
        }
      } catch (e) {}
    }

    function render() {
      const bar1List = document.getElementById('bar1-list');
      const bar2List = document.getElementById('bar2-list');
      const bar3List = document.getElementById('bar3-list');
      const bar4List = document.getElementById('bar4-list');

      if (!bar1List || !bar2List || !bar3List || !bar4List) return;

      bar1List.innerHTML = '';
      bar2List.innerHTML = '';
      bar3List.innerHTML = '';
      bar4List.innerHTML = '';

      let mcuCount = 0, watchedCount = 0, xmenCount = 0, spideyCount = 0;
      const totalItems = items.length;

      items.forEach(item => {
        if (searchQuery && !item.title.toLowerCase().includes(searchQuery)) return;

        const itemEl = document.createElement('div');
        itemEl.className = 'item-card';
        itemEl.onclick = (e) => {
          if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'A' && !e.target.closest('a')) toggleWatch(item.id);
        };

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'item-checkbox';
        checkbox.checked = item.watched;
        checkbox.onchange = () => toggleWatch(item.id);

        const badge = document.createElement('span');
        badge.className = 'item-index-badge';
        badge.innerText = `#${String(item.originalIndex).padStart(2, '0')}`;

        const infoDiv = document.createElement('div');
        infoDiv.className = 'item-info';

        const titleSpan = document.createElement('span');
        titleSpan.className = 'item-title';
        titleSpan.innerText = item.title;

        const metaDiv = document.createElement('div');
        metaDiv.className = 'item-meta';
        const tagLabel = item.category === 'mcu' ? 'MCU' : (item.category === 'xmen' ? 'X-MEN' : 'NON-MCU');
        metaDiv.innerHTML = `<span class="meta-tag">${tagLabel}</span>`;

        infoDiv.appendChild(titleSpan);
        infoDiv.appendChild(metaDiv);

        itemEl.appendChild(checkbox);
        itemEl.appendChild(badge);
        itemEl.appendChild(infoDiv);

        if (item.watched) {
          watchedCount++;
          bar2List.appendChild(itemEl);
        } else {
          if (item.category === 'mcu') {
            mcuCount++;
            bar1List.appendChild(itemEl);
          } else if (item.category === 'xmen') {
            xmenCount++;
            bar3List.appendChild(itemEl);
          } else if (item.category === 'spidey') {
            spideyCount++;
            bar4List.appendChild(itemEl);
          }
        }
      });

      if (watchedCount === 0) {
        bar2List.innerHTML = '<div class="empty-placeholder">No items marked as watched yet.<br>Click any movie/series to shift it here!</div>';
      }

      const progressPercent = totalItems > 0 ? Math.round((watchedCount / totalItems) * 100) : 0;
      document.getElementById('progress-fill').style.width = `${progressPercent}%`;
      document.getElementById('progress-stats').innerText = `${watchedCount} of ${totalItems} (${progressPercent}%)`;

      document.getElementById('mcu-count').innerText = `${mcuCount} Left`;
      document.getElementById('watched-count').innerText = `${watchedCount} Done`;
      document.getElementById('xmen-count').innerText = `${xmenCount} Left`;
      document.getElementById('spidey-count').innerText = `${spideyCount} Left`;

      document.getElementById('badge-mcu').innerText = mcuCount;
      document.getElementById('badge-watched').innerText = watchedCount;
      document.getElementById('badge-xmen').innerText = xmenCount;
      document.getElementById('badge-spidey').innerText = spideyCount;
    }

    initData();
    render();
    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
