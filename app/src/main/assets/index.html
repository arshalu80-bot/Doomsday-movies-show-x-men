<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AVENGERS: DOOMSDAY</title>
  <meta name="theme-color" content="#05070a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #05070a;
      --bg-card: rgba(13, 17, 23, 0.85);
      --bg-card-hover: rgba(22, 27, 34, 0.95);
      --accent-doom: #00ff88;
      --accent-mcu: #ff3344;
      --accent-watched: #a855f7;
      --accent-xmen: #f5b301;
      --accent-spidey: #00d2ff;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --safe-bottom: env(safe-area-inset-bottom, 16px);
      --safe-top: env(safe-area-inset-top, 16px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-top: var(--safe-top);
      padding-bottom: calc(76px + var(--safe-bottom));
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 255, 136, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 100% 100%, rgba(255, 51, 68, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 0% 100%, rgba(0, 210, 255, 0.05) 0%, transparent 40%);
      background-attachment: fixed;
    }

    /* APP HEADER */
    .app-header {
      padding: 16px 16px 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      background: rgba(5, 7, 10, 0.8);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 210, 255, 0.2));
      border: 1.5px solid rgba(0, 255, 136, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 14px rgba(0, 255, 136, 0.3);
    }

    .brand-icon svg {
      width: 20px;
      height: 20px;
      fill: #00ff88;
    }

    .app-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1.5px;
      background: linear-gradient(90deg, #00ff88 0%, #00d2ff 60%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:active {
      transform: scale(0.92);
      background: rgba(0, 255, 136, 0.15);
      border-color: var(--accent-doom);
    }

    .icon-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* COUNTDOWN & OVERALL PROGRESS */
    .hero-panel {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .countdown-card {
      background: linear-gradient(135deg, rgba(13, 17, 23, 0.9), rgba(18, 24, 33, 0.9));
      border: 1px solid rgba(0, 255, 136, 0.25);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .countdown-label-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .countdown-tag {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent-doom);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .countdown-target {
      font-size: 12px;
      color: var(--text-muted);
    }

    .countdown-grid {
      display: flex;
      gap: 6px;
    }

    .timer-unit {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 7px;
      padding: 4px 6px;
      min-width: 36px;
      text-align: center;
    }

    .timer-val {
      font-family: 'Orbitron', monospace;
      font-size: 13px;
      font-weight: 800;
      color: #fff;
    }

    .timer-sub {
      font-size: 8px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* PROGRESS BAR */
    .progress-section {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .progress-header span.val {
      color: var(--accent-doom);
      font-weight: 700;
    }

    .progress-track {
      height: 7px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-doom), var(--accent-spidey));
      border-radius: 4px;
      width: 0%;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
    }

    /* SEARCH & FILTER BAR */
    .search-box {
      padding: 0 16px 8px 16px;
    }

    .search-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input-wrap svg.search-ico {
      position: absolute;
      left: 12px;
      width: 16px;
      height: 16px;
      fill: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      background: rgba(13, 17, 23, 0.7);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 9px 36px 9px 36px;
      color: var(--text-main);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent-doom);
      box-shadow: 0 0 0 2px rgba(0, 255, 136, 0.15);
    }

    .search-clear {
      position: absolute;
      right: 10px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: none;
    }

    /* SUB-FILTER CHIPS */
    .filter-chips {
      display: flex;
      gap: 6px;
      padding: 0 16px 10px 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .filter-chips::-webkit-scrollbar {
      display: none;
    }

    .chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .chip.active {
      background: rgba(0, 255, 136, 0.15);
      border-color: var(--accent-doom);
      color: var(--accent-doom);
    }

    /* TAB HEADER BAR */
    .tab-header-banner {
      margin: 0 16px 10px 16px;
      padding: 10px 14px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid;
    }

    .tab-header-banner.mcu {
      background: rgba(255, 51, 68, 0.08);
      border-color: rgba(255, 51, 68, 0.3);
      color: var(--accent-mcu);
    }

    .tab-header-banner.watched {
      background: rgba(168, 85, 247, 0.08);
      border-color: rgba(168, 85, 247, 0.3);
      color: var(--accent-watched);
    }

    .tab-header-banner.xmen {
      background: rgba(245, 179, 1, 0.08);
      border-color: rgba(245, 179, 1, 0.3);
      color: var(--accent-xmen);
    }

    .tab-header-banner.spidey {
      background: rgba(0, 210, 255, 0.08);
      border-color: rgba(0, 210, 255, 0.3);
      color: var(--accent-spidey);
    }

    .tab-banner-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .tab-banner-pill {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid currentColor;
    }

    /* LIST CONTAINER */
    .media-list {
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .media-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .media-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: transparent;
      transition: background 0.2s;
    }

    .media-card.mcu::before { background: var(--accent-mcu); }
    .media-card.xmen::before { background: var(--accent-xmen); }
    .media-card.spidey::before { background: var(--accent-spidey); }
    .media-card.watched::before { background: var(--accent-watched); }

    .media-card:active {
      transform: scale(0.985);
      background: var(--bg-card-hover);
    }

    .card-checkbox {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
      background: rgba(0, 0, 0, 0.2);
    }

    .media-card.watched .card-checkbox {
      background: var(--accent-watched);
      border-color: var(--accent-watched);
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
    }

    .card-checkbox svg {
      width: 14px;
      height: 14px;
      fill: #fff;
      display: none;
    }

    .media-card.watched .card-checkbox svg {
      display: block;
    }

    .card-content {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
      min-width: 0;
    }

    .card-title {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.3;
      word-break: break-word;
      transition: color 0.2s;
    }

    .media-card.watched .card-title {
      color: var(--text-muted);
      text-decoration: line-through rgba(168, 85, 247, 0.6);
    }

    .card-meta-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .card-index {
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      font-weight: 700;
      color: var(--accent-doom);
    }

    .meta-tag {
      font-size: 9.5px;
      font-weight: 700;
      padding: 1.5px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .tag-movie { background: rgba(0, 210, 255, 0.15); color: #00d2ff; }
    .tag-show { background: rgba(255, 170, 0, 0.15); color: #ffaa00; }
    .tag-category { background: rgba(255, 255, 255, 0.08); color: var(--text-muted); }

    /* EMPTY STATE */
    .empty-state {
      padding: 40px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: var(--text-muted);
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      fill: rgba(255, 255, 255, 0.2);
    }

    /* 4-BAR BOTTOM NAVIGATION */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(5, 7, 10, 0.95);
      border-top: 1px solid var(--border-color);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 8px 6px calc(8px + var(--safe-bottom)) 6px;
      gap: 4px;
      z-index: 50;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 6px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
    }

    .nav-btn.active {
      background: rgba(255, 255, 255, 0.05);
    }

    .nav-btn.active.mcu { color: var(--accent-mcu); border-color: rgba(255, 51, 68, 0.3); }
    .nav-btn.active.watched { color: var(--accent-watched); border-color: rgba(168, 85, 247, 0.3); }
    .nav-btn.active.xmen { color: var(--accent-xmen); border-color: rgba(245, 179, 1, 0.3); }
    .nav-btn.active.spidey { color: var(--accent-spidey); border-color: rgba(0, 210, 255, 0.3); }

    .nav-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      text-align: center;
      line-height: 1.1;
    }

    .nav-badge {
      font-size: 9px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .nav-btn.active.mcu .nav-badge { background: var(--accent-mcu); color: #fff; }
    .nav-btn.active.watched .nav-badge { background: var(--accent-watched); color: #fff; }
    .nav-btn.active.xmen .nav-badge { background: var(--accent-xmen); color: #000; }
    .nav-btn.active.spidey .nav-badge { background: var(--accent-spidey); color: #000; }

    /* MODAL DIALOG */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal-box {
      background: #0d1117;
      border: 1px solid rgba(0, 255, 136, 0.3);
      border-radius: 16px;
      padding: 20px;
      max-width: 360px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
      animation: popIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 15px;
      font-weight: 800;
      color: var(--accent-doom);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .modal-body {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .modal-btn-row {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 6px;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent-doom);
      border: none;
      color: #05070a;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- APP HEADER -->
  <header class="app-header">
    <div class="brand-box">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 22h4.5l2.1-4.5h6.8l2.1 4.5H22L12 2zm0 6.5l2.4 5h-4.8l2.4-5z"/>
        </svg>
      </div>
      <h1 class="app-title">AVENGERS: DOOMSDAY</h1>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btn-random-pick" title="Random Unwatched Pick">
        <svg viewBox="0 0 24 24">
          <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM7.5 18c-.83 0-1.5-.67-1.5-1.5S6.67 15 7.5 15s1.5.67 1.5 1.5S8.33 18 7.5 18zm0-9C6.67 9 6 8.33 6 7.5S6.67 6 7.5 6 9 6.67 9 7.5 8.33 9 7.5 9zm4.5 4.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4.5 4.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm0-9c-.83 0-1.5-.67-1.5-1.5S15.67 6 16.5 6s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
        </svg>
      </button>
      <button class="icon-btn" id="btn-reset" title="Reset Watch Progress">
        <svg viewBox="0 0 24 24">
          <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- HERO PANEL: COUNTDOWN & OVERALL PROGRESS -->
  <section class="hero-panel">
    <div class="countdown-card">
      <div class="countdown-label-group">
        <span class="countdown-tag">COUNTDOWN TO DOOM</span>
        <span class="countdown-target">DECEMBER 18, 2026</span>
      </div>
      <div class="countdown-grid">
        <div class="timer-unit">
          <div class="timer-val" id="cnt-days">000</div>
          <div class="timer-sub">DAYS</div>
        </div>
        <div class="timer-unit">
          <div class="timer-val" id="cnt-hrs">00</div>
          <div class="timer-sub">HRS</div>
        </div>
        <div class="timer-unit">
          <div class="timer-val" id="cnt-min">00</div>
          <div class="timer-sub">MIN</div>
        </div>
        <div class="timer-unit">
          <div class="timer-val" id="cnt-sec">00</div>
          <div class="timer-sub">SEC</div>
        </div>
      </div>
    </div>

    <div class="progress-section">
      <div class="progress-header">
        <span>OVERALL MARVEL ROAD TO DOOM</span>
        <span class="val" id="progress-text">0 of 87 (0%)</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-bar"></div>
      </div>
    </div>
  </section>

  <!-- SEARCH INPUT -->
  <div class="search-box">
    <div class="search-input-wrap">
      <svg class="search-ico" viewBox="0 0 24 24">
        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
      </svg>
      <input type="text" id="search-input" class="search-input" placeholder="Search Marvel titles...">
    </div>
  </div>

  <!-- SUB FILTER CHIPS (VISIBLE IN MCU OR WATCHED TAB) -->
  <div class="filter-chips" id="filter-chips-container">
    <!-- Populated by JS -->
  </div>

  <!-- TAB HEADER BANNER -->
  <div class="tab-header-banner mcu" id="tab-banner">
    <span class="tab-banner-title" id="tab-banner-title">MCU MOVIES & SERIES (68)</span>
    <span class="tab-banner-pill" id="tab-banner-pill">68 Left</span>
  </div>

  <!-- MEDIA LIST CONTAINER -->
  <main class="media-list" id="media-list">
    <!-- Rendered dynamically by JS -->
  </main>

  <!-- 4-BAR BOTTOM NAVIGATION -->
  <nav class="bottom-nav">

    function loadSavedState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);

          const list = JSON.parse(raw);
          watchedSet = new Set(list);
        }
      } catch (e) {

      }

        localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(watchedSet)));
      } catch (e) {
        console.error("Failed to save state", e);
      }
    }

    // COUNTDOWN TICKER
    const targetDate = new Date("2026-12-18T00:00:00Z").getTime();
    function updateCountdown() {
      const now = new Date().getTime();
      const diff = Math.max(0, targetDate - now);
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById("cnt-days").innerText = String(days).padStart(3, '0');
      document.getElementById("cnt-hrs").innerText = String(hours).padStart(2, '0');
      document.getElementById("cnt-min").innerText = String(minutes).padStart(2, '0');
      document.getElementById("cnt-sec").innerText = String(seconds).padStart(2, '0');
    }
    setInterval(updateCountdown, 1000);
    updateCountdown();

    // RENDER LOGIC
    function renderApp() {
      const totalWatched = watchedSet.size;
      const totalItems = DATASET.length;
      const pct = totalItems > 0 ? Math.round((totalWatched / totalItems) * 100) : 0;

      // Update Overall Progress
      document.getElementById("progress-text").innerText = `${totalWatched} of ${totalItems} (${pct}%)`;
      document.getElementById("progress-bar").style.width = `${pct}%`;

      // Calculate Category Counts
      const mcuTotal = DATASET.filter(x => x.category === 'mcu').length;
      const mcuWatched = DATASET.filter(x => x.category === 'mcu' && watchedSet.has(x.id)).length;
      const mcuLeft = mcuTotal - mcuWatched;

      const xmenTotal = DATASET.filter(x => x.category === 'xmen').length;
      const xmenWatched = DATASET.filter(x => x.category === 'xmen' && watchedSet.has(x.id)).length;
      const xmenLeft = xmenTotal - xmenWatched;

      const spideyTotal = DATASET.filter(x => x.category === 'spidey').length;
      const spideyWatched = DATASET.filter(x => x.category === 'spidey' && watchedSet.has(x.id)).length;
      const spideyLeft = spideyTotal - spideyWatched;

      // Update Navigation Badges
      document.getElementById("nav-badge-mcu").innerText = mcuLeft;
      document.getElementById("nav-badge-watched").innerText = totalWatched;
      document.getElementById("nav-badge-xmen").innerText = xmenLeft;
      document.getElementById("nav-badge-spidey").innerText = spideyLeft;

      // Update Active Navigation Item
      document.querySelectorAll(".nav-btn").forEach(btn => {
        const tab = btn.getAttribute("data-tab");
        if (tab === currentTab) {
          btn.classList.add("active");
        } else {
          btn.classList.remove("active");
        }
      });

      // Update Tab Header Banner
      const banner = document.getElementById("tab-banner");
      const bannerTitle = document.getElementById("tab-banner-title");
      const bannerPill = document.getElementById("tab-banner-pill");

      banner.className = `tab-header-banner ${currentTab}`;
      if (currentTab === 'mcu') {
        bannerTitle.innerText = "MCU MOVIES & SERIES (68)";
        bannerPill.innerText = `${mcuLeft} Left`;
      } else if (currentTab === 'watched') {
        bannerTitle.innerText = "MOVIES WATCH HISTORY";
        bannerPill.innerText = `${totalWatched} Done`;
      } else if (currentTab === 'xmen') {
        bannerTitle.innerText = "X-MEN MOVIES (14)";
        bannerPill.innerText = `${xmenLeft} Left`;
      } else if (currentTab === 'spidey') {
        bannerTitle.innerText = "NON MCU SPIDER-MAN MOVIES (5)";
        bannerPill.innerText = `${spideyLeft} Left`;
      }

      // Render Sub-filter Chips
      renderFilterChips();

      // Filter Data for Main List
      let displayItems = [];
      if (currentTab === 'mcu') {
        displayItems = DATASET.filter(x => x.category === 'mcu' && !watchedSet.has(x.id));
        if (mcuFilter === 'MOVIES') displayItems = displayItems.filter(x => !x.isShow);
        if (mcuFilter === 'SHOWS') displayItems = displayItems.filter(x => x.isShow);
      } else if (currentTab === 'watched') {
        displayItems = DATASET.filter(x => watchedSet.has(x.id));
        if (watchedFilter === 'MCU') displayItems = displayItems.filter(x => x.category === 'mcu');
        if (watchedFilter === 'XMEN') displayItems = displayItems.filter(x => x.category === 'xmen');
        if (watchedFilter === 'SPIDEY') displayItems = displayItems.filter(x => x.category === 'spidey');
      } else if (currentTab === 'xmen') {
        displayItems = DATASET.filter(x => x.category === 'xmen' && !watchedSet.has(x.id));
      } else if (currentTab === 'spidey') {
        displayItems = DATASET.filter(x => x.category === 'spidey' && !watchedSet.has(x.id));
      }

      // Apply Search Filter
      if (searchQuery.trim().length > 0) {
        const q = searchQuery.toLowerCase().trim();
        displayItems = displayItems.filter(x => x.title.toLowerCase().includes(q));
      }

      // Render Media Cards
      const listContainer = document.getElementById("media-list");
      if (displayItems.length === 0) {
        listContainer.innerHTML = `

            </svg>
            <div>No titles found</div>
          </div>
        `;
        return;
      }

      let html = "";
      displayItems.forEach(item => {
        const isWatched = watchedSet.has(item.id);
        const idxText = `#${String(item.originalIndex).padStart(2, '0')}`;
        const catTag = item.category === 'spidey' ? 'SPIDER-MAN' : item.category.toUpperCase();

        html += `
          <div class="media-card ${item.category} ${isWatched ? 'watched' : ''}" data-id="${item.id}">
            <div class="card-checkbox">
              <svg viewBox="0 0 24 24">
                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
              </svg>
            </div>
            <div class="card-content">
              <div class="card-title">${item.title}</div>
              <div class="card-meta-row">
                <span class="card-index">${idxText}</span>
                <span class="meta-tag tag-category">${catTag}</span>
                <span class="meta-tag ${item.isShow ? 'tag-show' : 'tag-movie'}">${item.typeTag}</span>
                <span class="meta-tag tag-category">${item.releaseYear}</span>
              </div>
            </div>
          </div>
        `;
      });
      listContainer.innerHTML = html;

      // Attach Card Clicks
      document.querySelectorAll(".media-card").forEach(card => {
        card.addEventListener("click", () => {
          const id = card.getAttribute("data-id");
          toggleWatched(id);
        });
      });
    }

    function renderFilterChips() {
      const container = document.getElementById("filter-chips-container");
      if (currentTab === 'mcu') {
        container.style.display = "flex";
        container.innerHTML = `
          <div class="chip ${mcuFilter === 'ALL' ? 'active' : ''}" data-filter="ALL">All MCU (68)</div>
          <div class="chip ${mcuFilter === 'MOVIES' ? 'active' : ''}" data-filter="MOVIES">Movies Only</div>
          <div class="chip ${mcuFilter === 'SHOWS' ? 'active' : ''}" data-filter="SHOWS">Series / Shows</div>
        `;
        container.querySelectorAll(".chip").forEach(ch => {
          ch.addEventListener("click", () => {
            mcuFilter = ch.getAttribute("data-filter");
            renderApp();
          });
        });
      } else if (currentTab === 'watched') {
        container.style.display = "flex";

          <div class="chip ${watchedFilter === 'ALL' ? 'active' : ''}" data-wfilter="ALL">All Done</div>

          <div class="chip ${watchedFilter === 'SPIDEY' ? 'active' : ''}" data-wfilter="SPIDEY">Spider-Man</div>
        `;
        container.querySelectorAll(".chip").forEach(ch => {
          ch.addEventListener("click", () => {
            watchedFilter = ch.getAttribute("data-wfilter");
            renderApp();
          });
        });
      } else {
        container.style.display = "none";
      }
    }

    function toggleWatched(id) {
      if (watchedSet.has(id)) {
        watchedSet.delete(id);
      } else {
        watchedSet.add(id);
      }
      saveState();
      renderApp();
    }

    // TAB SELECTION
    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        currentTab = btn.getAttribute("data-tab");
        renderApp();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });

    // SEARCH LISTENER
    document.getElementById("search-input").addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderApp();
    });

    // RANDOM PICK MODAL
    const modalBackdrop = document.getElementById("modal-backdrop");
    const modalTitle = document.getElementById("modal-title");
    const modalBody = document.getElementById("modal-body");
    const modalActionBtn = document.getElementById("modal-action-btn");
    const modalCancelBtn = document.getElementById("modal-cancel-btn");

    document.getElementById("btn-random-pick").addEventListener("click", () => {
      let unwatchedPool = [];
      if (currentTab === 'mcu') {
        unwatchedPool = DATASET.filter(x => x.category === 'mcu' && !watchedSet.has(x.id));
      } else if (currentTab === 'xmen') {
        unwatchedPool = DATASET.filter(x => x.category === 'xmen' && !watchedSet.has(x.id));
      } else if (currentTab === 'spidey') {
        unwatchedPool = DATASET.filter(x => x.category === 'spidey' && !watchedSet.has(x.id));
      } else {
        unwatchedPool = DATASET.filter(x => !watchedSet.has(x.id));
      }

      if (unwatchedPool.length === 0) {
        modalTitle.innerText = "ALL CAUGHT UP!";
        modalBody.innerText = "You have completed all titles in this section! Ready for Avengers: Doomsday!";
        modalActionBtn.style.display = "none";
        modalCancelBtn.innerText = "Awesome";
      } else {
        const picked = unwatchedPool[Math.floor(Math.random() * unwatchedPool.length)];
        modalTitle.innerText = "NEXT ON YOUR WATCHLIST";
        modalBody.innerHTML = `
          <strong style="color: #fff; font-size: 15px;">${picked.title}</strong><br><br>
          <span style="color: var(--accent-doom); font-weight: 700;">#${picked.originalIndex} in ${picked.category.toUpperCase()}</span> • ${picked.typeTag} (${picked.releaseYear})
        `;
        modalActionBtn.style.display = "block";
        modalActionBtn.innerText = "Mark as Watched";
        modalActionBtn.onclick = () => {
          watchedSet.add(picked.id);
          saveState();
          renderApp();
          modalBackdrop.classList.remove("show");
        };
        modalCancelBtn.innerText = "Close";
      }
      modalBackdrop.classList.add("show");
    });

    // RESET MODAL
    document.getElementById("btn-reset").addEventListener("click", () => {
      modalTitle.innerText = "RESET WATCH PROGRESS?";
      modalBody.innerText = "Are you sure you want to reset your watchlist? All 87 MCU, X-Men, and Spider-Man items will be marked as unwatched.";
      modalActionBtn.style.display = "block";
      modalActionBtn.innerText = "Reset All";
      modalActionBtn.onclick = () => {
        watchedSet.clear();
        saveState();
        renderApp();
        modalBackdrop.classList.remove("show");
      };
      modalCancelBtn.innerText = "Cancel";
      modalBackdrop.classList.add("show");
    });

    modalCancelBtn.addEventListener("click", () => {
      modalBackdrop.classList.remove("show");
    });
    modalBackdrop.addEventListener("click", (e) => {
      if (e.target === modalBackdrop) {
        modalBackdrop.classList.remove("show");
      }
    });

    // INIT
    loadSavedState();
    renderApp();
  </script>
</body>
</html>
